name: Deploy ULTRA Web Demo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "pyproject.toml"
      - "env/environment.yml"
      - "src/cad2gis/webdemo/**"
      - "tools/build_webdemo.py"
      - "tests/test_webdemo_build.py"
      - "tests/test_review_server.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up native GIS runtime
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: env/environment.yml
          cache-environment: true
          cache-downloads: true
          init-shell: bash

      - name: Install WebDemo test runtime
        run: python -m pip install -e ".[mcp,review,test]"
        shell: micromamba-shell {0}

      - name: Verify browser scripts and contracts
        run: |
          node --check src/cad2gis/webdemo/app.js
          node --check src/cad2gis/webdemo/demo-fixture.js
          python -m pytest tests/test_webdemo_build.py tests/test_review_server.py -q
        shell: micromamba-shell {0}

      - name: Build data-free public demo
        run: python tools/build_webdemo.py --output _site
        shell: micromamba-shell {0}

      - name: Upload static demo
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
