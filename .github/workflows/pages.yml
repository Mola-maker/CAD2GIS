name: Deploy CAD2GIS Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "README.md"
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - "plugins/cad2gis-agent/**"
      - "src/cad2gis/webdemo/**"
      - "scripts/build_pages.py"
      - "scripts/verify_derived_release.py"
      - "scripts/fetch_derived_release.py"
      - "docs/derived-release.json"
      - "pages-delivery/**"
      - "tests/test_ci_contracts.py"
      - "tests/test_plugin_contracts.py"
      - "tests/test_webdemo_plugin_guide.py"
      - "tests/test_pages_publication_gate.py"
      - "tests/test_webdemo_shared_assets.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install contract test runtime
        run: python -m pip install pytest

      - name: Verify install matrix and browser scripts
        run: |
          node --check src/cad2gis/webdemo/landing.js
          node --check src/cad2gis/webdemo/hero-tube.js
          node --check src/cad2gis/webdemo/install.js
          node --check src/cad2gis/webdemo/pointer.js
          node --check src/cad2gis/webdemo/app.js
          node --check src/cad2gis/webdemo/demo-fixture.js
          node --check src/cad2gis/webdemo/original-demo/assets/app.js
          python -m pytest tests/test_ci_contracts.py tests/test_webdemo_plugin_guide.py tests/test_pages_publication_gate.py tests/test_webdemo_shared_assets.py -q

      - name: Fetch and verify authorized derived demonstration
        run: python scripts/fetch_derived_release.py

      - name: Build Pages with verified derived demonstrations
        run: python scripts/build_pages.py --output _site

      - name: Upload verified site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
