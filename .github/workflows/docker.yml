name: CAD2GIS Docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - pyproject.toml
      - src/**
      - tools/container_smoke.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Read package version for Docker tags
        id: package
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if not re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}", version):
              raise ValueError("Package version is not a valid Docker tag")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY
      - name: Build runtime image
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t cad2gis:${{ steps.package.outputs.version }} -t cad2gis:latest .
      - name: Verify installed runtime and MCP entrypoint
        run: |
          mkdir -p docker-artifacts
          docker run --rm cad2gis:${{ steps.package.outputs.version }} > docker-artifacts/doctor.json
          docker run --rm --entrypoint cad2gis-agent-mcp cad2gis:${{ steps.package.outputs.version }} --help
          docker run --rm cad2gis:${{ steps.package.outputs.version }} debug-mcp --scope identity --json > docker-artifacts/debug-mcp.json
          docker run --rm --entrypoint pip cad2gis:${{ steps.package.outputs.version }} freeze > docker-artifacts/requirements-resolved.txt
          docker image inspect cad2gis:${{ steps.package.outputs.version }} > docker-artifacts/image-inspect.json
      - name: Exercise CAD export, indexed SQLite and optional SVG
        run: docker run --rm --entrypoint python -v "$PWD/tools/container_smoke.py:/tmp/container_smoke.py:ro" cad2gis:${{ steps.package.outputs.version }} /tmp/container_smoke.py > docker-artifacts/conversion-smoke.json
      - name: Export tested image
        run: |
          docker save cad2gis:${{ steps.package.outputs.version }} cad2gis:latest | gzip > docker-artifacts/cad2gis-image.tar.gz
          cd docker-artifacts && sha256sum cad2gis-image.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cad2gis-docker-${{ steps.package.outputs.version }}-${{ github.sha }}
          path: docker-artifacts/
          compression-level: 0
          retention-days: 7
