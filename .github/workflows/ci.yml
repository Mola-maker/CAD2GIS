name: CAD2GIS CI

on:
  push:
    branches: [main, robustness]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            shell: "bash -el {0}"
          - os: ubuntu-latest
            python: "3.12"
            shell: "bash -el {0}"
          - os: windows-latest
            python: "3.12"
            shell: "pwsh"
          - os: macos-latest
            python: "3.12"
            shell: "bash -el {0}"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up native GIS runtime
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: cad2gis-ci
          create-args: >-
            python=${{ matrix.python }}
            pip
            gdal=3.10.*
            pyproj=3.7.*
            ezdxf=1.4.*
            numpy>=1.24
            scipy>=1.10
            shapely=2.1.*
            pillow>=11,<13
          cache-environment: true
          cache-downloads: true
          init-shell: >-
            bash
            powershell

      - name: Install package and quality tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[mcp,review,test]"
        shell: ${{ matrix.shell }}

      - name: Lint Python
        run: python -m ruff check src tests tools plugins/cad2gis-agent/scripts
        shell: ${{ matrix.shell }}

      - name: Compile Python modules
        run: python -m compileall -q src/cad2gis plugins/cad2gis-agent/scripts
        shell: ${{ matrix.shell }}

      - name: Check WebDemo JavaScript
        run: node --check src/cad2gis/webdemo/app.js && node --check src/cad2gis/webdemo/demo-fixture.js
        shell: ${{ matrix.shell }}

      - name: Run contract and regression tests
        env:
          CAD2GIS_FULL_DWG_TESTS: "0"
        run: python -m pytest -q
        shell: ${{ matrix.shell }}

      - name: Build Python distribution
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python -m build
        shell: ${{ matrix.shell }}

      - name: Build data-free WebDemo artifact
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python tools/build_webdemo.py --output _site
        shell: ${{ matrix.shell }}
