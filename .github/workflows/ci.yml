name: CAD2GIS CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precision-agent:
    name: Offline precision and Agent protocol gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test and portable GIS dependencies
        run: python -m pip install -e ".[agent,test]"
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Verify deterministic matching, GCP and MCP failures
        # These fixtures do not call a public OSM/LLM endpoint or open private
        # DWG drawings. The full platform/runtime matrix remains below.
        env:
          CAD2GIS_FULL_DWG_TESTS: "0"
        run: >-
          python -m pytest -q
          tests/test_agent_tool_bridge.py
          tests/test_desktop_agent.py
          tests/test_mcp_diagnostics.py
          tests/test_mcp_stdio.py
          tests/test_plugin_contracts.py
          tests/test_database_mcp.py
          tests/test_osm_matching.py
          tests/test_osm_anchor.py
          tests/test_osm_pipeline.py
          tests/test_osm_topology_ingest.py
          tests/test_osm_evidence.py
          tests/test_geometry_fidelity.py
          tests/test_source_gpkg.py
          tests/test_source_gpkg_field_indices.py
          tests/test_source_replay.py
          tests/test_source_relocation.py
          tests/test_visual_audit_transforms.py
          tests/test_stage_contracts_hash_streaming.py
          tests/test_gcp_editing.py
          tests/test_gcp_workflow.py
          tests/test_review_native_geometry.py
          tests/test_runtime_archive_permissions.py
          --junitxml=test-results/precision-agent.xml
      - name: Preserve precision and protocol results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precision-agent-${{ github.sha }}
          path: test-results/precision-agent.xml
          if-no-files-found: warn
          retention-days: 14

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install portable agent runtime and quality tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[agent,test]"

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Install portable LibreDWG reader
        run: cad2gis runtime install

      - name: Verify conversion runtime
        run: cad2gis doctor --deep --strict --profile full --json

      - name: Lint Python
        run: python -m ruff check src tests tools plugins/cad2gis-agent/scripts

      - name: Compile Python modules
        run: python -m compileall -q src/cad2gis plugins/cad2gis-agent/scripts tools/build_webdemo.py tools/build_hero_font.py

      - name: Check desktop and WebDemo JavaScript
        run: node --check src/cad2gis/desktop/app.js && node --check src/cad2gis/webdemo/app.js && node --check src/cad2gis/webdemo/demo-fixture.js && node --check src/cad2gis/webdemo/hero-motion.js && node --check tools/build_hero_assets.mjs

      - name: Generate repo-native SVG geometry
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: npm ci && npm run build:hero && python tools/build_hero_font.py

      - name: Run contract and regression tests
        env:
          CAD2GIS_FULL_DWG_TESTS: "0"
        run: python -m pytest -q --junitxml=test-results/regression.xml

      - name: Preserve platform regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}
          path: test-results/regression.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Build Python distribution
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python -m build

      - name: Build WebDemo with derived map fixtures
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python tools/build_webdemo.py --output _site
