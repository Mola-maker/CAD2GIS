name: CAD2GIS CI

on:
  push:
    branches: [main, robustness]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up native GIS runtime
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: cad2gis-ci
          create-args: >-
            python=${{ matrix.python }}
            pip
            gdal=3.10.*
            pyproj=3.7.*
            ezdxf=1.4.*
            numpy>=1.24
            scipy>=1.10
            shapely=2.1.*
            pillow>=11,<13
          cache-environment: true
          cache-downloads: true
          init-shell: none

      - name: Install package and quality tools
        run: micromamba run -n cad2gis-ci python -m pip install --upgrade pip && micromamba run -n cad2gis-ci python -m pip install -e ".[mcp,review,test]"

      - name: Lint Python
        run: micromamba run -n cad2gis-ci python -m ruff check src tests tools plugins/cad2gis-agent/scripts

      - name: Compile Python modules
        run: micromamba run -n cad2gis-ci python -m compileall -q src/cad2gis plugins/cad2gis-agent/scripts tools/build_webdemo.py tools/build_hero_font.py

      - name: Check WebDemo JavaScript
        run: node --check src/cad2gis/webdemo/app.js && node --check src/cad2gis/webdemo/demo-fixture.js && node --check tools/build_hero_assets.mjs

      - name: Generate repo-native SVG geometry
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: npm ci && npm run build:hero && micromamba run -n cad2gis-ci python tools/build_hero_font.py

      - name: Run contract and regression tests
        env:
          CAD2GIS_FULL_DWG_TESTS: "0"
        run: micromamba run -n cad2gis-ci python -m pytest -q

      - name: Build Python distribution
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: micromamba run -n cad2gis-ci python -m build

      - name: Build data-free WebDemo artifact
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: micromamba run -n cad2gis-ci python tools/build_webdemo.py --output _site
