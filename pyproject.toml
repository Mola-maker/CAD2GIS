[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cad2gis"
version = "0.7.8"
description = "Deterministic CAD-to-GIS orchestration and verification CLI"
readme = { text = "CAD2GIS provides a lightweight canonical API and CLI with a bundled cad2gis.cad2gis_v3 backend. The GIS runtime and backend deployment are preflighted with `cad2gis doctor`.", content-type = "text/markdown" }
requires-python = ">=3.11,<3.13"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md", "NOTICE.md", "packaging/THIRD_PARTY_NOTICES.md", "packaging/patches/COPYING", "packaging/patches/NOTICE.md"]
authors = [{ name = "CAD2GIS contributors" }]
dependencies = [
  "numpy>=1.24",
  "pyproj>=3.6,<4",
  "shapely>=2.0",
  "ezdxf>=1.4,<2",
  "resvg-py==0.5.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
symbols = ["ezdxf>=1.4,<2"]
test = ["pytest>=8,<10", "build>=1.2,<2", "ruff==0.12.12", "fonttools[woff]>=4.53,<5", "Pillow>=11,<13"]
mcp = ["mcp>=1.0,<2"]
review = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
review-postgis = ["psycopg[binary]>=3.2,<4"]
redis = ["redis>=5,<8"]
portable = ["ezdxf>=1.4,<2", "pyramids-gis==0.58.1", "Pillow>=11,<13"]
agent = [
  "pydantic-ai-slim[openai]==2.42.0",
  "mcp>=1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "ezdxf>=1.4,<2",
  "pyramids-gis==0.58.1",
  "Pillow>=11,<13",
]

[project.scripts]
cad2gis = "cad2gis.cli:main"
cad2gis-desktop = "cad2gis.application:main"
cad2gis-agent-mcp = "cad2gis.agent_mcp:main"
cad2gis-symbols = "cad2gis.symbol_assets:main"
cad2gis-qgis-package = "cad2gis.qgis_package:main"
cad2gis-qgis-verify = "cad2gis.qgis_verify:main"
cad2gis-qgis-review = "cad2gis.qgis_review:main"
cad2gis-qgis-review-verify = "cad2gis.qgis_review_verify:main"
cad2gis-svg-delivery = "cad2gis.svg_delivery:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false
# The canonical backend ships from src/cad2gis/cad2gis_v3. An explicit
# CAD2GIS_BACKEND_PATH remains available for separately deployed backends and
# is reported by `cad2gis doctor`.

[tool.setuptools.packages.find]
where = ["src"]
include = ["cad2gis*"]
namespaces = true

[tool.setuptools.package-data]
cad2gis = ["desktop/*.html", "desktop/*.css", "desktop/*.js", "desktop/assets/*", "desktop/vendor/*", "desktop/docs/*.md", "webdemo/*.html", "webdemo/*.css", "webdemo/*.js", "webdemo/*.json", "webdemo/assets/*.svg", "webdemo/assets/*.png", "webdemo/assets/*.json", "webdemo/assets/*.woff2", "webdemo/assets/font-licenses/*.txt", "webdemo/assets/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
