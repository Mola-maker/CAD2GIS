[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cad2gis"
version = "0.1.0"
description = "Deterministic CAD-to-GIS orchestration and verification CLI"
readme = { text = "CAD2GIS provides a lightweight canonical API and CLI. The pinned GIS runtime and separately deployed cad2gis_v3 backend are preflighted with `cad2gis doctor`.", content-type = "text/markdown" }
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "CAD2GIS contributors" }]
dependencies = [
  "numpy>=1.24",
  "pyproj>=3.6,<4",
  "scipy>=1.10",
  "shapely>=2.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1.2,<2", "ruff==0.12.12", "fonttools>=4.53,<5"]
mcp = ["mcp>=1.0,<2"]
review = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
review-postgis = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
cad2gis = "cad2gis.cli:main"
cad2gis-agent-mcp = "cad2gis.agent_mcp:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false
# The canonical backend ships from src/cad2gis/cad2gis_v3. An explicit
# CAD2GIS_BACKEND_PATH remains available for separately deployed backends and
# is reported by `cad2gis doctor`.

[tool.setuptools.packages.find]
where = ["src"]
include = ["cad2gis*"]
namespaces = true

[tool.setuptools.package-data]
cad2gis = ["webdemo/*.html", "webdemo/*.css", "webdemo/*.js", "webdemo/*.json", "webdemo/assets/*.svg", "webdemo/assets/*.json", "webdemo/assets/*.woff2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
