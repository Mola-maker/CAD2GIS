name: cad2gis
channels:
  - conda-forge
dependencies:
  # The supported GIS runtime.  System Python (in particular 3.14) is not the
  # target for the GDAL/QGIS stack.
  - python=3.12.*
  - pip=25.1.*
  - setuptools=80.9.*
  - wheel=0.45.*
  - gdal=3.10.*
  - pyproj=3.7.*
  - ezdxf=1.4.*
  - numpy>=1.24
  - scipy>=1.10
  - shapely=2.1.*
  - pillow>=11,<13
  - fonttools=4.63.*
  - brotli-python=1.1.*
  - fastapi>=0.115,<1
  - uvicorn>=0.30,<1
  - websockets>=13,<16
  # Keep ABI-sensitive transitive dependencies in the Conda layer. This
  # prevents stale wheels from a previous Python minor from surviving an
  # in-place runtime update.
  - cffi=2.1.*
  - pytest=9.0.*
  - ruff=0.12.*
  - basedpyright=1.29.*
  - pip:
      # Optional agent/plugin control plane.  It does not replace the pinned
      # GDAL/QGIS conversion runtime or enter reader/geometry calculations.
      - mcp>=1.0,<2
